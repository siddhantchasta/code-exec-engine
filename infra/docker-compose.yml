## Docker Compose — Redis, PostgreSQL, and three stateless worker replicas
## Usage: cd infra && docker-compose up -d

services:
  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - '5434:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: code_exec
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../docs/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    restart: unless-stopped

  worker:
    image: node:20-slim
    working_dir: /app
    command: node worker/index.js
    environment:
      API_KEY: development-key
      REDIS_URL: redis://redis:6379
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: postgres
      PG_PASSWORD: postgres
      PG_DATABASE: code_exec
      WORKER_ID: ${HOSTNAME:-worker}
    volumes:
      - ..:/app:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - redis
      - postgres
    deploy:
      replicas: 3
    restart: unless-stopped

  watchdog:
    image: node:20-slim
    working_dir: /app
    command: node worker/watchdog.js
    environment:
      API_KEY: development-key
      REDIS_URL: redis://redis:6379
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: postgres
      PG_PASSWORD: postgres
      PG_DATABASE: code_exec
    volumes:
      - ..:/app:ro
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

volumes:
  pgdata:
